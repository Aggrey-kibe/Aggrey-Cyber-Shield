# Builds a DEBUG APK of the Android app so it can be downloaded from the run page.
# Same safety rules as ci.yml: read-only token, no secrets, actions pinned to full commit SHAs.
# The debug APK is signed with the standard Android debug key. It is for testing only, not for release.
name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      api_base_url_debug:
        description: "Server address for the debug app, for example http://192.168.1.50:8001/ or http://127.0.0.1:8001/ for USB testing. Leave empty for the emulator default."
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the preinstalled JDK 17
        run: |
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Set the server address for the debug app
        env:
          API_URL: ${{ inputs.api_base_url_debug }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "No address given: the app keeps the emulator default (http://10.0.2.2:8000/)."
            exit 0
          fi
          if [[ "$API_URL" == *$'\n'* || "$API_URL" == *$'\r'* ]]; then
            echo "Refused: the address must be a single line."
            exit 1
          fi
          if ! printf '%s' "$API_URL" | grep -Eq '^http://(127\.0\.0\.1|10(\.[0-9]{1,3}){3}|192\.168(\.[0-9]{1,3}){2}|172\.(1[6-9]|2[0-9]|3[01])(\.[0-9]{1,3}){2}):[0-9]{2,5}/?$'; then
            echo "Refused: only loopback or private network addresses are allowed."
            exit 1
          fi
          printf 'API_BASE_URL_DEBUG=%s\n' "$API_URL" > android/local.properties
          echo "The debug app will use: $API_URL"
      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Show the APK and its checksum
        run: |
          ls -l android/app/build/outputs/apk/debug/
          sha256sum android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aggrey-shield-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
