# Continuous integration for Aggrey Shield.
#
# Security posture of this workflow:
#  * read-only token (permissions: contents: read); no secrets are used anywhere
#  * runs only on the plain pull_request trigger, so forks cannot reach secrets
#  * third-party actions are pinned to full commit SHAs, not movable tags
#  * every value below that looks like a secret is a throwaway CI-only dummy
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: new vulnerability advisories can appear without any code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Ruff (syntax errors, undefined names, unused imports)
        run: |
          pip install ruff==0.17.1
          ruff check backend

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aggrey
          POSTGRES_PASSWORD: aggrey_ci_password
          POSTGRES_DB: aggrey_ci_test      # must end in _test, or the database tests refuse to run
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aggrey -d aggrey_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      # Fail loudly if the database tests would be silently skipped.
      CI_REQUIRE_DB_TESTS: "1"
      DATABASE_URL: postgresql+asyncpg://aggrey:aggrey_ci_password@localhost:5432/aggrey_ci_test
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghij
      RESEND_API_KEY: re_ci_not_a_real_key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Apply database migrations from an empty database
        run: alembic upgrade head
      - name: Model and migrations must agree (no drift)
        run: alembic check
      - name: Run the test suite
        run: python -m pytest -q -p no:cacheprovider

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Audit the whole installed stack, including indirect packages
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip-audit --progress-spinner off

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t aggrey-shield-backend:ci backend
      - name: Runs as a non-root user and ships no test tools
        run: |
          uid="$(docker run --rm --entrypoint id aggrey-shield-backend:ci -u)"
          echo "container user id: ${uid}"
          test "${uid}" != "0"
          if docker run --rm --entrypoint python aggrey-shield-backend:ci -c "import pytest" 2>/dev/null; then
            echo "::error::test tooling found in the production image"
            exit 1
          fi
      - name: Refuses to start in production with a weak signing secret
        run: |
          if docker run --rm -e ENVIRONMENT=production -e JWT_SECRET_KEY=tooshort -e RESEND_API_KEY=re_ci_not_a_real_key \
               aggrey-shield-backend:ci python -c "import app.main" >/dev/null 2>&1; then
            echo "::error::the app started in production with a weak JWT secret"
            exit 1
          fi
      - name: Starts in production mode and reports healthy
        run: |
          docker run -d --name shield -p 8000:8000 \
            -e ENVIRONMENT=production -e DEBUG=false \
            -e JWT_SECRET_KEY=ci-only-not-a-real-secret-0123456789abcdefghij \
            -e RESEND_API_KEY=re_ci_not_a_real_key \
            -e DATABASE_URL=postgresql+asyncpg://nobody:nopass@127.0.0.1:5432/none \
            aggrey-shield-backend:ci
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          status=""
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' shield)"
            [ "${status}" = "healthy" ] && break
            sleep 5
          done
          echo "container health status: ${status}"
          test "${status}" = "healthy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/docs)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/scans)" = "401"
      - name: Container logs
        if: always()
        run: docker logs shield || true
